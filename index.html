<style>
:root{--bg:#f4f4f5;--card:#fff;--tx:#2b2d33;--mu:#8a8d95;--ln:#e3e4e8;--inc:#3d96e0;--exp:#e8532c;--wn:#e0a100;--bar:rgba(255,255,255,.92);--sel:#e9f2fc;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1d21;--tx:#eceef2;--mu:#8f939c;--ln:#2e3036;--inc:#5aaaf0;--exp:#ff7650;--wn:#f2c14e;--bar:rgba(28,29,33,.92);--sel:#1f3042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1d21;--tx:#eceef2;--mu:#8f939c;--ln:#2e3036;--inc:#5aaaf0;--exp:#ff7650;--wn:#f2c14e;--bar:rgba(28,29,33,.92);--sel:#1f3042;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 12px 100px}
h1{font-size:19px;text-align:center;margin:6px 0 10px;font-weight:600}h2{font-size:16px;margin:18px 4px 8px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav b{flex:1;text-align:center;background:var(--sel);border-radius:10px;padding:9px;font-size:18px}.nav b small{font-weight:400;color:var(--mu);font-size:13px}
button,input,select{font:inherit;color:inherit}
.ib{width:40px;height:40px;border:0;border-radius:20px;background:var(--card);font-size:20px}
.sum{display:flex;text-align:center;background:var(--card);border-radius:12px;padding:10px 0;margin:10px 0}
.sum div{flex:1;font-size:13px;color:var(--mu)}.sum b{display:block;font-size:16px;font-weight:600;margin-top:2px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.wn{color:var(--wn)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-radius:12px;overflow:hidden}
.cal .h{text-align:center;font-size:13px;padding:5px 0;background:var(--ln);color:var(--mu)}
.cal .d{min-height:54px;padding:3px;border-top:1px solid var(--ln);border-right:1px solid var(--ln);font-size:12px;overflow:hidden;cursor:pointer}
.cal .d.o{opacity:.35}.cal .d.sel{background:var(--sel)}.cal .d.today>span{font-weight:700;color:var(--inc)}
.cal .d i{display:block;font-style:normal;font-size:10px;text-align:right;white-space:nowrap}
.list{background:var(--card);border-radius:12px;margin-top:10px;overflow:hidden}
.dh{display:flex;justify-content:space-between;background:var(--ln);padding:6px 12px;font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.ic{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row .n{flex:1;min-width:0}.row .n small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--ln);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:8px;padding:9px;background:transparent}.seg button.on{background:var(--card);font-weight:600}
.f{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.f label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
.f input,.f select,.mb input{width:100%;border:1px solid var(--ln);border-radius:10px;padding:11px;background:var(--bg)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{border:2px solid transparent;border-radius:12px;background:var(--bg);padding:9px 4px;font-size:13px}.cats button.on{border-color:var(--inc);background:var(--sel)}
.cats button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:18px;padding:7px 12px;font-size:14px;white-space:nowrap}
.dd{display:flex;gap:8px;margin-top:6px}.dd button{border:1px solid var(--ln);background:var(--bg);border-radius:14px;padding:4px 12px;font-size:13px}
.pv{font-size:14px;margin-top:6px;padding:7px 10px;border-radius:8px;background:var(--sel)}.pv.wn{background:#fff3cf;color:#7a5a00}.pv.bad{background:#fde7e1;color:#a2381b}
.pri{width:100%;border:0;border-radius:12px;padding:14px;background:var(--inc);color:#fff;font-weight:600;margin-top:6px}
.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.dng{background:var(--exp)}
.donut{width:200px;height:200px;border-radius:50%;margin:10px auto;position:relative}.donut::after{content:"";position:absolute;inset:50px;background:var(--bg);border-radius:50%}
.bar{height:10px;border-radius:5px;background:var(--ln);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.pct{color:var(--mu);font-size:13px;min-width:46px;text-align:right}
.jar{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.jh{display:flex;align-items:center;gap:10px}.jh b{flex:1}.jh .p{border:1px dashed var(--ln);border-radius:12px;padding:3px 10px;background:var(--bg);font-size:14px}
.jm{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:6px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(496px,calc(100% - 24px));display:flex;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:30px;padding:5px;z-index:20}
.tabs button{flex:1;border:0;background:transparent;border-radius:24px;padding:7px 0;font-size:11px;color:var(--tx)}.tabs button.on{background:var(--sel);color:var(--inc);font-weight:600}.tabs button span{display:block;font-size:20px}
.st{font-size:13px;text-align:center;padding:8px;border-radius:10px;margin-bottom:10px;background:var(--sel)}.st.bad{background:#fde7e1;color:#a2381b}.st.wn{background:#fff3cf;color:#7a5a00;text-align:left}
.tip{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.sq{width:100%;border:1px solid var(--ln);border-radius:12px;padding:11px;background:var(--card);margin-bottom:8px}
.empty{padding:22px;text-align:center;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;background:var(--card);border-radius:12px;padding:10px 8px 4px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars div u{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:80px;text-decoration:none}.bars div u i{width:40%;border-radius:3px 3px 0 0;min-height:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100% - 24px));background:#23262d;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;z-index:30}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:var(--card);border-radius:16px;padding:16px;width:min(380px,100%)}.mb p{margin:0 0 10px}.mbt{display:flex;gap:8px;margin-top:10px}

/* ---- gọn hơn, nổi bật hơn ---- */
:root{--bg:#edf0f6;--sel:#e1edfb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:#1b1d22;--sel:#1f3042}}
body{font-size:14px}#app{padding:8px 10px 84px}
.f,.list,.sum,.jar,.tip,.cal,.bars{box-shadow:0 1px 4px rgba(20,30,60,.09)}
h1{font-size:16px;margin:2px 0 8px}h2{font-size:14px;margin:12px 4px 6px}
.nav{margin-bottom:6px}.nav b{padding:6px;font-size:16px}.nav b small{font-size:11px}.ib{width:34px;height:34px;font-size:18px}
.sum{padding:7px 0;margin:6px 0}.sum div{font-size:11px}.sum b{font-size:14px}
.cal .d{min-height:42px;font-size:11px}.cal .d i{font-size:9px}.cal .h{font-size:11px;padding:3px 0}
.row{padding:8px 10px;gap:8px}.ic{width:30px;height:30px;font-size:16px}
.tabs{padding:3px}.tabs button{padding:5px 0;font-size:10px}.tabs button span{font-size:17px}
.seg{margin-bottom:6px}.seg button{padding:6px;font-size:14px}
.tip{padding:7px 10px;font-size:13px;margin-bottom:6px;line-height:1.5}
.dh{padding:4px 10px;font-size:12px}.jar{padding:10px}
.chips{margin-bottom:4px;padding-bottom:4px}.chip{padding:5px 10px;font-size:12px;background:var(--card)}
.fa{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.fa input{flex:1;min-width:0;width:100%;height:40px;border:1px solid var(--ln);border-radius:10px;padding:0 10px;background:var(--card);font-size:16px;-webkit-appearance:none;appearance:none;text-align:left}
#fa{font-size:20px;font-weight:600;height:46px}
.fa .pri{margin:0;flex:1;padding:11px 6px}.fa .chip{height:34px}
.pv{margin:0 0 6px;font-size:12px;padding:5px 9px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.k button{border:2px solid transparent;border-radius:12px;padding:4px 2px;font-size:11px;line-height:1.15;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx)}
.k button i{font-style:normal;font-size:21px}
.dn{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(20,30,60,.09)}
.dn .donut{width:116px;height:116px;margin:0;flex:none}.dn .donut::after{inset:32px;background:var(--card)}
.lg{flex:1;min-width:0;font-size:12px}.lg div{display:flex;align-items:center;gap:6px;padding:2px 0}.lg i{width:9px;height:9px;border-radius:5px;flex:none}.lg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{height:84px;padding:6px 8px 2px}.bars div u{height:56px}
.fa textarea{flex:1;min-width:0;height:56px;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--card);font:inherit;font-size:16px;resize:none;color:var(--tx)}
.rv{border-bottom:1px solid var(--ln);padding-bottom:4px;margin-bottom:8px}
.rv select{flex:1;min-width:0;height:40px;border:1px solid var(--ln);border-radius:10px;padding:0 8px;background:var(--bg);font-size:15px}
.chips{position:relative}.chip{opacity:1;color:var(--tx)}
</style>

<body>
<div id="app"></div><div id="tst"></div>
<nav class="tabs" id="tabs"></nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const CATS=[[1,"Ăn uống",0,"#ff8700"],[4,"Xăng Xe",0,"#ff54a8"],[3,"Mua Sắm bản thân",0,"#1638a7"],[2,"Công Ty",0,"#00b547"],[18,"Cắt Tóc",0,"#00a0f5"],[5,"Hiếu, Hỷ, Hội Nhóm",0,"#ffd500"],[6,"Thăm khám bệnh",0,"#61e396"],[7,"Giáo dục",0,"#ff4950"],[8,"Hoá Đơn, Lãi",0,"#09ceff"],[9,"Hẹn Hò",0,"#ff54a8"],[10,"Mua, trả cho NY",0,"#ff8700"],[11,"Du Lịch",0,"#ffa400"],[19,"ăn, uống với NY",0,"#00a0f5"],[20,"Cho, Lì xì",0,"#990ba6"],[21,"Sửa chữa, Gửi xe",0,"#f264ff"],[23,"Giải Trí",0,"#f264ff"],[24,"sửa, may quần áo",0,"#4fd800"],[25,"Cho Vay",0,"#ed54b4"],[12,"Tiền lương",1,"#4eb46a"],[13,"Tiền phụ cấp",1,"#ffb27f"],[14,"Tiền thưởng",1,"#ff2e00"],[15,"Thu nhập phụ",1,"#00c7ff"],[16,"Đầu tư",1,"#42d2c1"],[17,"Thu nhập tạm thời",1,"#f98bbe"]];
const ICON={1:"🍜",4:"⛽",3:"👕",2:"🏢",18:"✂️",5:"🎎",6:"💊",7:"🎓",8:"🧾",9:"💞",10:"🛍️",11:"✈️",19:"🍲",20:"🧧",21:"🔧",23:"🎮",24:"🧵",25:"🤲",12:"💼",13:"🚌",14:"🎁",15:"💵",16:"📈",17:"⏳"};
const JARS=[["NEC","Thiết yếu","🏠","#2f80ed",55],["LTS","Dự phòng","🛡️","#9b51e0",10],["FFA","Đầu tư","📈","#27ae60",10],["EDU","Giáo dục","📚","#f2994a",10],["GIVE","Cho đi","🤝","#e91e8c",5],["PLAY","Trải nghiệm","🎉","#eb5757",10]];
const DEF={1:"NEC",4:"NEC",3:"NEC",2:"NEC",18:"NEC",6:"NEC",8:"NEC",21:"NEC",24:"NEC",7:"EDU",9:"PLAY",10:"PLAY",11:"PLAY",19:"PLAY",23:"PLAY",5:"GIVE",20:"GIVE",25:"FFA"};
const PRESETS=[["💍","Quỹ cưới"],["🚗","Mua xe"],["🏠","Xây nhà"],["🛡️","Dự phòng khẩn cấp"],["✈️","Du lịch"],["🎯",""]];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],{id:c[0],n:c[1],t:c[2],col:c[3]}]));
const CATS0=CATS.map(c=>c.slice()),ICON0={...ICON};
const DEFCATS=()=>CATS0.map(c=>({id:c[0],n:c[1],t:c[2],col:c[3],i:ICON0[c[0]]||"•"}));
const vis=c=>CATS.some(x=>x[0]===c);
function applyCats(){
  const l=(S.cfg&&Array.isArray(S.cfg.cats)&&S.cfg.cats.length)?S.cfg.cats:DEFCATS();
  CATS.length=0;for(const k in ICON)delete ICON[k];for(const k in CAT)delete CAT[k];
  l.forEach(c=>{ICON[c.id]=c.i||"•";CAT[c.id]={id:c.id,n:c.n,t:c.t,col:c.col};if(!c.h)CATS.push([c.id,c.n,c.t,c.col])})
}
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const fmt=n=>Math.round(n).toLocaleString("en-US")+"đ";
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date(),curYm=now.getFullYear()+"-"+pad(now.getMonth()+1);
let S={q:"",tab:"cal",ym:curYm,sel:iso(now),months:{},cfg:{pct:{},warn:80,map:{},goals:[]},rtype:0,edit:null,form:{t:0,d:iso(now),a:"",m:"",c:null},status:"Đang kết nối…",bad:false,db:null,base:null,dl:null,loaded:false,toast:""};

/* ---------- hộp thoại riêng (không phụ thuộc prompt của trình duyệt) ---------- */
function ask(msg,def="",input=true){return new Promise(res=>{const o=document.createElement("div");o.className="mo";o.innerHTML=`<div class="mb"><p>${esc(msg)}</p>${input?`<input value="${esc(def)}">`:""}<div class="mbt"><button class="pri sec" data-x="0">Huỷ</button><button class="pri" data-x="1">OK</button></div></div>`;document.body.appendChild(o);const i=o.querySelector("input");if(i)i.focus();o.onclick=e=>{const x=e.target.dataset.x;if(x===undefined)return;o.remove();res(x==="1"?(i?i.value:true):null)}})}
function toast(t){S.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast="";render()},6000)}
function parseAmt(s){s=String(s).toLowerCase().replace(/\s|đ|vnd/g,"");const m=s.match(/^([\d.,]+)(k|tr|m|nghìn|ngàn|triệu)?$/);if(!m)return 0;const u=m[2];const n=u?parseFloat(m[1].replace(",",".")):parseFloat(m[1].replace(/[.,]/g,""));return Math.round(n*({k:1e3,"nghìn":1e3,"ngàn":1e3,tr:1e6,m:1e6,"triệu":1e6}[u]||1))||0}

/* ---------- tài khoản và lưu trữ online (Firebase) ---------- */
Object.assign(S,{user:undefined,uid:null,email:"",err:""});
let auth=null,db=null,unsubs=[];
const CFG=window.FIREBASE_CONFIG,cfgOk=!!(CFG&&CFG.apiKey&&CFG.projectId&&!/DÁN/i.test(CFG.apiKey+CFG.projectId));
if(cfgOk){try{const app=initializeApp(CFG);auth=getAuth(app);
  try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}}catch(e){S.err="Cấu hình Firebase trong config.js chưa đúng: "+(e.message||e)}}
const ERR={"auth/invalid-credential":"Sai email hoặc mật khẩu.","auth/wrong-password":"Sai mật khẩu.","auth/user-not-found":"Email này chưa có tài khoản, hãy bấm Tạo tài khoản.","auth/email-already-in-use":"Email này đã có tài khoản, hãy bấm Đăng nhập.","auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.","auth/invalid-email":"Email chưa đúng.","auth/missing-password":"Bạn chưa nhập mật khẩu.","auth/network-request-failed":"Không có mạng, hãy thử lại.","auth/too-many-requests":"Thử quá nhiều lần, hãy đợi một lúc rồi thử lại.","auth/operation-not-allowed":"Chưa bật Email/Password trong Firebase Authentication.","auth/unauthorized-domain":"Tên miền này chưa được thêm vào Authorized domains của Firebase."};
function init(){
  if(!cfgOk||!auth){S.user=null;if(!S.err)S.err="Chưa dán cấu hình Firebase vào file config.js.";render();return}
  render();
  onAuthStateChanged(auth,u=>{
    unsubs.forEach(f=>f());unsubs=[];S.months={};S.loaded=false;S.bad=false;S.user=u||null;S.uid=u?u.uid:null;
    if(u){S.status="Đang kết nối…";
      unsubs.push(onSnapshot(collection(db,"users",u.uid,"months"),{includeMetadataChanges:true},snap=>{
        const m={};snap.docs.forEach(d=>{m[d.id]=(d.data().items||[]).slice()});S.months=m;S.loaded=true;S.bad=false;
        const n=Object.values(m).reduce((a,b)=>a+b.length,0);
        S.status=snap.metadata.hasPendingWrites?"Đang đồng bộ lên máy chủ…":(snap.metadata.fromCache&&!navigator.onLine)?"Đang offline · dữ liệu sẽ tự đồng bộ khi có mạng":"Đã đồng bộ online · "+n+" giao dịch";render()
      },e=>{S.status="Lỗi đồng bộ: "+(e.code||e.message);S.bad=true;render()}));
      unsubs.push(onSnapshot(doc(db,"users",u.uid,"meta","cfg"),d=>{const c=d.data()||{};S.cfg={pct:c.pct||{},warn:c.warn||80,map:c.map||{},goals:(c.goals||[]).slice(),cats:Array.isArray(c.cats)?c.cats:null};applyCats();render()},()=>{}))
    }
    render()
  })
}
async function doAuth(kind){
  const e=($("#le")?.value||"").trim(),p=$("#lp")?.value||"";S.email=e;S.err="";
  try{if(kind==="login")await signInWithEmailAndPassword(auth,e,p);else if(kind==="signup")await createUserWithEmailAndPassword(auth,e,p);else{await sendPasswordResetEmail(auth,e);S.err="Đã gửi email đặt lại mật khẩu (kiểm tra cả thư rác)."}}
  catch(er){S.err=ERR[er.code]||("Lỗi: "+(er.code||er.message))}
  render()
}
function saveMonth(ym){
  if(!db||!S.uid){render();return}
  setDoc(doc(db,"users",S.uid,"months",ym),{items:S.months[ym]||[]}).catch(e=>{S.status="Lưu thất bại: "+(e.code||e.message);S.bad=true;render()});
  render()
}
function saveCfg(){
  applyCats();
  if(db&&S.uid)setDoc(doc(db,"users",S.uid,"meta","cfg"),S.cfg).catch(e=>{S.status="Lưu cài đặt thất bại: "+(e.code||e.message);S.bad=true;render()});
  render()
}
async function exportCsv(){

const all=()=>Object.values(S.months).flat(),inMonth=ym=>S.months[ym]||[];

const jarOf=c=>S.cfg.map[c]||DEF[c]||"NEC",pctOf=j=>S.cfg.pct[j]??JARS.find(x=>x[0]===j)[4],JAR=j=>JARS.find(x=>x[0]===j);
function jarStats(ym){const it=inMonth(ym),inc=sumBy(it,1),r={};JARS.forEach(j=>r[j[0]]={alloc:inc*pctOf(j[0])/100,spent:0});it.filter(x=>!x.t).forEach(x=>r[jarOf(x.c)].spent+=x.a);return r}

const warnTxt=w=>`${w.j[2]} Hũ ${w.j[1]} đã dùng ${w.q.toFixed(0)}%${w.q>100?" – vượt hạn mức":" hạn mức"}`;

}

async function del(){const o=S.edit;if(!o||await ask("Xoá giao dịch này?","",false)===null)return;S.months[o.ym]=(S.months[o.ym]||[]).filter(x=>x.id!==o.id);S.edit=null;S.tab="cal";await saveMonth(o.ym)}
function toCsv(){
  const r=["inputDateString,amount,memo,categoryId,type"];
  all().sort((a,b)=>a.d.localeCompare(b.d)).forEach(x=>{const[y,m,d]=x.d.split("-");r.push([`${y}/${+m}/${+d}`,x.a,'"'+(x.m||"").replace(/"/g,'""')+'"',x.c,x.t].join(","))});
  return "\ufeff"+r.join("\n")
}
function parseCsv(txt){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch=='"'){if(txt[i+1]=='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch=='"')q=true;else if(ch==","){row.push(cur);cur=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&txt[i+1]=="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows
}
async function importCsv(file){
  const txt=(await file.text()).replace(/^\ufeff/,""),rows=parseCsv(txt),out=[];let on=!txt.includes("#DAILY_DATAS"),h=null;
  for(const r of rows){if(r[0]&&r[0][0]==="#"){on=r[0]==="#DAILY_DATAS";h=null;continue}if(!on||r.length<2)continue;if(!h){h=r;continue}
    const g=k=>r[h.indexOf(k)],p=(g("inputDateString")||"").split("/");if(p.length<3)continue;
    out.push({d:p[0]+"-"+pad(+p[1])+"-"+pad(+p[2]),a:parseInt(g("amount"),10),m:g("memo")||"",c:parseInt(g("categoryId"),10),t:parseInt(g("type"),10)||0})}
  let added=0;const touched=new Set();
  for(const x of out){if(!x.a||!CAT[x.c])continue;const ym=x.d.slice(0,7),l=(S.months[ym]??=[]);
    if(l.some(y=>y.d===x.d&&y.a===x.a&&y.c===x.c&&y.m===x.m&&y.t===x.t))continue;
    l.push({id:"i"+Date.now().toString(36)+added,...x});added++;touched.add(ym)}
  for(const ym of touched)await saveMonth(ym);
  S.status="Đã nhập thêm "+added+" giao dịch";render()
}

const KW=[[/xăng|đổ dầu/,4],[/lương/,12],[/phụ cấp/,13],[/thưởng/,14],[/thuốc|khám|bệnh|viện/,6],[/cắt tóc|tóc/,18],[/tiền điện|điện|internet|wifi|tiền nhà|trọ|trả góp|lãi|hóa đơn|hoá đơn|icloud|tiền nước|tiền net|nạp tiền|nạp thẻ|điện thoại|4g/,8],[/học|sách|khoá|khóa/,7],[/game|phim|giải trí|netflix/,23],[/du lịch|vé máy bay|khách sạn/,11],[/lì xì/,20],[/đám|cưới|hiếu|hỷ|mừng/,5],[/quần|áo|giày|dép/,3],[/gửi xe|sửa xe|vá xe|thay nhớt|nhớt/,21],[/cà phê|cafe|cơm|phở|bún|bánh|trà|nước|mì|ăn|uống|sáng|trưa|tối|chợ|trà sữa|bia|nhậu|quán|đồ ăn|highlands|starbucks|cháo|lẩu|nướng/,1]];
function habitMap(){const c={};all().forEach(x=>{const k=(x.m||"").toLowerCase().trim();if(k.length<2)return;((c[k]??={})[x.c]=(c[k][x.c]||0)+1)});const h={};for(const k in c){h[k]=+Object.entries(c[k]).sort((a,b)=>b[1]-a[1])[0][0]}return h}
function guessCat(seg,H){const s=seg.toLowerCase();let best=null,bl=0;for(const k in H)if(s.includes(k)&&k.length>bl){bl=k.length;best=H[k]}if(best&&vis(best))return best;for(const c of CATS){const n=c[1].toLowerCase();if(n.length>=3&&s.includes(n))return c[0]}for(const[re,c]of KW)if(re.test(s)&&vis(c))return c;return null}
const AMT=/(\d+)\s*(?:tr|triệu|củ)\s*(\d{1,2})(?!\d|k|\s?nghìn|\s?ngàn)|(\d[\d.,]*)\s*(tr|triệu|củ|k|nghìn|ngàn)?(?![a-zà-ỹ])/gi;
function amtOf(m){if(m[1]!==undefined)return +m[1]*1e6+(m[2].length===1?+m[2]*1e5:+m[2]*1e4);return parseAmt(m[3]+(m[4]||""))}
function localParse(text){
  const dd=n=>iso(new Date(now-n*864e5));let day=dd(0),t=text;
  if(/hôm kia/i.test(t)){day=dd(2);t=t.replace(/hôm kia/ig,"")}else if(/hôm qua/i.test(t)){day=dd(1);t=t.replace(/hôm qua/ig,"")}
  else t=t.replace(/hôm nay/ig,"");
  const H=habitMap(),out=[];
  for(const chunk of t.split(/[,;\n]|\svà\s/i)){
    const ms=[...chunk.matchAll(AMT)].map(m=>({m,a:amtOf(m)})).filter(x=>x.a>0&&(x.m[4]||x.m[1]!==undefined||x.a>=1000));
    if(!ms.length)continue;
    let pos=0;
    ms.forEach((x,i)=>{
      const s=x.m.index,e=s+x.m[0].length;
      let memo=ms.length===1?(chunk.slice(0,s)+" "+chunk.slice(e)):chunk.slice(pos,s)+(i===ms.length-1?" "+chunk.slice(e):"");
      pos=e;memo=memo.replace(/\s+/g," ").trim();
      const c=guessCat(memo,H),inc=c?CAT[c].t===1:/lương|thưởng|nhận|được cho|thu nhập/i.test(memo);
      out.push({d:day,a:x.a,m:memo,c,t:inc?1:0})})
  }
  return out
}
function aiPrompt(text){
  const habit={};all().forEach(x=>{if(x.m&&CAT[x.c]){const k=x.m.toLowerCase()+"→"+CAT[x.c].n;habit[k]=(habit[k]||0)+1}});
  const hab=Object.entries(habit).sort((a,b)=>b[1]-a[1]).slice(0,30).map(x=>x[0]).join("; ");
  const dd=n=>iso(new Date(now-n*864e5));
  return `Bạn là trợ lý ghi sổ thu chi cho người Việt. Hôm nay là ${dd(0)}. Hãy tách đoạn nói/gõ dưới đây thành từng khoản thu hoặc chi.
Quy ước tiền: k, nghìn, ngàn = 1.000; tr, triệu, củ = 1.000.000 (2tr3 = 2.300.000). amount là số nguyên đồng.
type: 0 = chi tiêu, 1 = thu nhập. categoryId phải là MỘT id trong danh sách: ${CATS.map(c=>c[0]+"="+c[1]+(c[2]?" (thu nhập)":"")).join("; ")}.
date: YYYY-MM-DD, mặc định ${dd(0)}; hôm qua = ${dd(1)}; hôm kia = ${dd(2)}. memo: mô tả ngắn, chữ thường, tiếng Việt.
Thói quen của người dùng (ghi chú→danh mục), hãy ưu tiên theo đó: ${hab||"chưa có"}.
Đoạn cần tách: """${text}"""`
}
function aiNormalize(arr){
  const H=habitMap(),dd=iso(now);
  return (Array.isArray(arr)?arr:[]).map(x=>{let c=+x.categoryId;const a=Math.round(+x.amount),m=String(x.memo||"").trim();
    if(!vis(c))c=guessCat(m,H);
    return {d:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:dd,a,m,c,t:c?CAT[c].t:(x.type===1?1:0)}}).filter(x=>x.a>0)
}
async function aiParse(text){
  const base="https://www.gstatic.com/firebasejs/12.19.0/";
  const [A,I]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-ai.js")]);
  let app;try{app=A.getApp("ai")}catch(e){app=A.initializeApp(CFG,"ai");
    if(window.APPCHECK_SITE_KEY){try{const AC=await import(base+"firebase-app-check.js");AC.initializeAppCheck(app,{provider:(window.APPCHECK_TYPE==="v3"?new AC.ReCaptchaV3Provider(window.APPCHECK_SITE_KEY):new AC.ReCaptchaEnterpriseProvider(window.APPCHECK_SITE_KEY)),isTokenAutoRefreshEnabled:true})}catch(e2){console.warn("AppCheck",e2)}}}
  const ai=I.getAI(app,{backend:new I.GoogleAIBackend()});
  const P=I.Schema,schema=P.array({items:P.object({properties:{memo:P.string(),amount:P.number(),categoryId:P.number(),type:P.number(),date:P.string()}})});
  let saved=null;try{saved=localStorage.getItem("aiModel")}catch(e){}
  const models=[...new Set([saved,window.AI_MODEL,"gemini-3.5-flash-lite","gemini-3.8-flash","gemini-3.1-flash-lite"].filter(Boolean))];
  let last;
  for(const name of models){
    try{const model=I.getGenerativeModel(ai,{model:name,generationConfig:{responseMimeType:"application/json",responseSchema:schema}});
      const r=await Promise.race([model.generateContent(aiPrompt(text)),new Promise((_,j)=>setTimeout(()=>j(new Error("Quá thời gian chờ AI")),25000))]);const arr=JSON.parse(r.response.text());
      try{localStorage.setItem("aiModel",name)}catch(e){}
      return aiNormalize(arr)
    }catch(e){last=e;if(/\[401\]|\[403\]|\[429\]|App Check|timeout|Quá thời gian/i.test(String(e&&e.message)))break}
  }
  throw last
}

const aiHint=e=>{const m=String((e&&e.message)||"");
  if(/App Check/i.test(m))return "AI đang bị chặn bởi App Check";
  if(/\[403\]|PERMISSION|has not been used|disabled/i.test(m))return "AI chưa được bật hoặc khoá API đang bị giới hạn";
  if(/\[429\]|quota|exhausted/i.test(m))return "đã hết lượt AI miễn phí lúc này, thử lại sau";
  if(/\[404\]|not found/i.test(m))return "tên model AI không còn dùng được";
  if(!navigator.onLine||/Failed to fetch|network/i.test(m))return "không có mạng";
  if(/Quá thời gian/.test(m))return "AI phản hồi quá chậm";
  return String((e&&(e.code||m))||"lỗi không rõ").slice(0,120)};
async function runAi(text){
  if(!text){toast("Hãy gõ hoặc nói nội dung trước (dùng biểu tượng micro trên bàn phím iPhone).");return}
  S.toast="✨ Đang phân tích…";render();
  let items,src="ai",note="";
  try{items=await aiParse(text)}catch(e){src="local";note=" (AI chưa dùng được: "+aiHint(e)+". App tạm dùng cách đoán đơn giản)";items=localParse(text)}
  S.toast="";render();
  if(!items.length){toast("Chưa nhận ra khoản nào. Hãy thử ghi kiểu: cà phê 20k, đổ xăng 50k."+note);return}
  const res=await reviewSheet(items,src,note);if(!res)return;
  const touched=new Set();let n=0;
  for(const x of res){const ym=x.d.slice(0,7);(S.months[ym]??=[]).push({id:"a"+Date.now().toString(36)+(n++)+Math.random().toString(36).slice(2,4),d:x.d,a:x.a,m:(x.m||"").trim(),c:x.c,t:x.t});touched.add(ym)}
  const last=res[res.length-1];S.aiText="";S.ym=last.d.slice(0,7);S.sel=last.d;S.tab="cal";
  const w=[...touched].flatMap(warns),jars=new Set(res.filter(x=>!x.t).map(x=>jarOf(x.c)));
  const wn=w.find(k=>jars.has(k.j[0]));
  for(const ym of touched)saveMonth(ym);
  toast((wn?(wn.q>100?"🚨 ":"⚠️ ")+warnTxt(wn)+" · ":"")+"✅ Đã lưu "+n+" khoản")
}

        const i=firstEmoji(ed.i)||"🏷️";let nl;
        if(ed.id)nl=l.map(x=>x.id===ed.id?{...x,n,i,col:ed.col}:x);
        else{const id=Math.max(100,...l.map(x=>x.id))+1;nl=[...l,{id,n,t:ty,col:ed.col,i}];ed.id=id}
        if(ty===0)S.cfg={...S.cfg,map:{...S.cfg.map,[ed.id]:ed.j}};
        commit(nl);ed=null;msg=""
      }
    }
    else if(k==="del"){
      const id=+v,c=l.find(x=>x.id===id),n=used(id);if(!c)return;
      const okk=await ask(n?`Mục "${c.n}" đã có ${n} giao dịch nên sẽ được ẩn đi (lịch sử vẫn giữ nguyên, bạn có thể khôi phục sau). Tiếp tục?`:`Xoá mục "${c.n}"?`,"",false);
      if(okk===null)return;
      if(S.form.c===id)S.form.c=null;
      commit(n?list().map(x=>x.id===id?{...x,h:1}:x):list().filter(x=>x.id!==id));
      msg=n?"Đã ẩn mục "+c.n:"Đã xoá mục "+c.n
    }
    else if(k==="res"){commit(l.map(x=>x.id===+v?{...x,h:0}:x));msg=""}
    draw()
  });
  draw()
})}
document.addEventListener("input",e=>{if(e.target.id==="ft"){S.aiText=e.target.value;return}if(e.target.id==="fq"){S.q=e.target.value;$("#res").innerHTML=resHtml();$("#cb").style.display=S.q.trim()?"none":"";return}
  if(e.target.id==="fa"||e.target.id==="fm"){readForm();$("#pv").innerHTML=pv()}});
document.addEventListener("change",e=>{
  if(e.target.id==="imp"&&e.target.files[0])importCsv(e.target.files[0]);
  if(e.target.dataset.map){S.cfg={...S.cfg,map:{...S.cfg.map,[e.target.dataset.map]:e.target.value}};saveCfg()}
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-tab],[data-a],[data-day],[data-edit],[data-t],[data-c],[data-r],[data-jp],[data-warn],[data-gadd],[data-gdep],[data-gt],[data-gdel],[data-qc],[data-dd]");if(!el)return;const D=el.dataset;
  if(D.tab){readForm();S.tab=D.tab}
  else if(D.a==="prev")S.ym=shift(S.ym,-1);else if(D.a==="next")S.ym=shift(S.ym,1);
  else if(D.day){S.sel=D.day;S.form.d=D.day}
  else if(D.edit){const x=inMonth(D.ym).find(y=>y.id===D.edit);if(x){S.edit={id:x.id,ym:D.ym};S.form={t:x.t,d:x.d,a:String(x.a),m:x.m,c:x.c};S.tab="add"}}
  else if(D.t!==undefined){readForm();S.form.t=+D.t;S.form.c=null}
  else if(D.c){readForm();S.form.c=+D.c}
  else if(D.qc){S.form={...S.form,t:0,c:+D.qc,m:D.qm,a:D.qa}}
  else if(D.dd!==undefined){readForm();S.form.d=iso(new Date(now-(+D.dd)*864e5))}
  else if(D.r!==undefined)S.rtype=+D.r;
  else if(D.jp){const v=await ask("Tỷ lệ thu nhập chia vào hũ "+JAR(D.jp)[1]+" (%)",String(pctOf(D.jp)));if(v!==null){const n=parseFloat(v.replace(",","."));if(n>=0&&n<=100){S.cfg={...S.cfg,pct:{...S.cfg.pct,[D.jp]:n}};await saveCfg()}}}
  else if(D.warn){const v=await ask("Cảnh báo khi hũ đã dùng từ bao nhiêu % hạn mức?",String(S.cfg.warn));const n=parseInt(v);if(n>0&&n<=200){S.cfg={...S.cfg,warn:n};await saveCfg()}}
  else if(D.gadd!==undefined){let[i,n]=D.gadd.split("|");if(!n){n=(await ask("Tên quỹ (VD: Mua đất)",""))||"";i="🎯"}
    if(n){const t=parseAmt((await ask("Cần tiết kiệm bao nhiêu cho "+n+"? (VD: 200tr)",""))||"");if(t){S.cfg={...S.cfg,goals:[...S.cfg.goals,{id:"g"+Date.now().toString(36),n,i,t,s:0}]};await saveCfg()}}}
  else if(D.gdep){const g=S.cfg.goals.find(x=>x.id===D.gdep),v=await ask("Nạp thêm bao nhiêu vào "+g.n+"? (số âm để rút)","");const neg=(v||"").trim().startsWith("-"),n=parseAmt((v||"").replace("-",""));if(n){S.cfg={...S.cfg,goals:S.cfg.goals.map(x=>x.id===g.id?{...x,s:Math.max(0,x.s+(neg?-n:n))}:x)};await saveCfg()}}
  else if(D.gt){const g=S.cfg.goals.find(x=>x.id===D.gt),n=parseAmt((await ask("Mục tiêu mới cho "+g.n,String(g.t)))||"");if(n){S.cfg={...S.cfg,goals:S.cfg.goals.map(x=>x.id===g.id?{...x,t:n}:x)};await saveCfg()}}
  else if(D.gdel){if(await ask("Xoá quỹ này?","",false)!==null){S.cfg={...S.cfg,goals:S.cfg.goals.filter(x=>x.id!==D.gdel)};await saveCfg()}}
  else if(D.a==="cats"){readForm();await catSheet()}
  else if(D.a==="login"||D.a==="signup"||D.a==="reset"){await doAuth(D.a);return}
  else if(D.a==="logout"){if(await ask("Đăng xuất khỏi tài khoản này?","",false)!==null)await signOut(auth);return}
  else if(D.a==="ai"){await runAi((($("#ft")&&$("#ft").value)||S.aiText||"").trim());return}
  else if(D.a==="save"){await save();return}
  else if(D.a==="savemore"){await save(true);return}
  else if(D.a==="del"){await del();return}
  else if(D.a==="cancel"){S.edit=null;S.form={t:0,d:iso(now),a:"",m:"",c:null};S.tab="cal"}
  else if(D.a==="export"){await exportCsv();return}
  render()
});
init();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&iso(new Date())!==iso(now))location.reload()});
</script>
